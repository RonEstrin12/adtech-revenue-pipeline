# Typecheck and tests on every PR and every push to master.
# Postgres runs as a service so the integration suites run instead of skipping.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: adtech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeline -d adtech"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/adtech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm test
